# Executa a suíte de testes a cada push e pull request.
# Os testes simulam o LibreOffice e o FFmpeg, então o runner não precisa de nenhum dos dois.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Node ${{ matrix.node }} em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts evita baixar o binário do FFmpeg (ffmpeg-static), que os testes não usam
      # e cujo download pela internet pode falhar de forma intermitente.
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Rodar testes
        run: npm test
