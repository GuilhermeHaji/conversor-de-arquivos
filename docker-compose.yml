# Produção: o conversor fica atrás do Caddy, que cuida do HTTPS (certificado grátis e renovação automática).
# Uso no servidor:  docker compose up -d --build
# O domínio e os limites vêm do arquivo .env (veja .env.example).

services:
  conversor:
    build: .
    restart: unless-stopped
    environment:
      # Um proxy (o Caddy) na frente: o IP real do visitante vem no X-Forwarded-For.
      TRUST_PROXY: "1"
      # Limites para o público (menores que os do uso local).
      MAX_DOC_MB: ${MAX_DOC_MB:-20}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-100}
      ZIP_MAX_MB: ${ZIP_MAX_MB:-100}
      ZIP_MAX_FILES: ${ZIP_MAX_FILES:-20}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      # Por IP: até 20 conversões a cada 10 minutos, no máximo 2 ao mesmo tempo.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_MIN: ${RATE_LIMIT_WINDOW_MIN:-10}
      MAX_ACTIVE_PER_IP: ${MAX_ACTIVE_PER_IP:-2}
    # Só o Caddy acessa o conversor; a porta 3000 não fica exposta na internet.
    expose:
      - "3000"
    mem_limit: 8g
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - conversor
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO no arquivo .env}
      LIMITE_UPLOAD: ${LIMITE_UPLOAD:-110MB}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
